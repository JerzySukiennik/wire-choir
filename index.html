<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<title>Wire Choir</title>
<meta name="description" content="Wpisz tekst, a neonowe głowy zaśpiewają go fizycznym modelem gardła.">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23000%27/%3E%3Ccircle cx=%2716%27 cy=%2714%27 r=%277%27 fill=%27none%27 stroke=%27%234fd2ff%27 stroke-width=%271.6%27/%3E%3Cpath d=%27M12 22h8%27 stroke=%27%237dffb6%27 stroke-width=%271.6%27/%3E%3C/svg%3E">
</head>
<body>
<canvas id="stage" aria-label="Śpiewające głowy"></canvas>
<header id="bar">
  <div class="bar-l">Wire Choir</div>
  <button class="bar-c" id="status" data-open="song"></button>
</header>
<nav id="rail" aria-label="Panele">
  <button data-open="heads"><svg viewBox="0 0 24 24"><path d="M12 3.5c-3.6 0-6 2.6-6 6 0 1.7.6 3 1.5 4l.2 2.3c.1.9.8 1.6 1.7 1.6H11v2.6h3.5v-2.6c2.6 0 4.2-1.6 4.2-4.1 0-.8.5-1.1.8-1.6.4-.6-.1-1.1-.6-1.4C18.6 6.6 16 3.5 12 3.5z"/></svg><span></span></button>
  <button data-open="song"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h12M4 17h8"/></svg><span></span></button>
  <button data-open="notes"><svg viewBox="0 0 24 24"><path d="M3.5 17h5M7 12h6M11 7h5M15.5 15h5M3.5 21h17"/></svg><span></span></button>
  <button data-open="play"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M8 5.5v8M12 5.5v8M16 5.5v8"/></svg><span></span></button>
  <button data-open="presets"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><path d="M16.5 13.5v6M13.5 16.5h6"/></svg><span></span></button>
  <button data-open="listen"><svg viewBox="0 0 24 24"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg><span></span></button>
  <button data-open="export"><svg viewBox="0 0 24 24"><path d="M12 15V4M8 8l4-4 4 4M5 13v5.5h14V13"/></svg><span></span></button>
</nav>
<main id="dock">
  <div id="history"></div>
  <div id="field">
    <div id="kara" aria-live="polite"></div>
    <textarea id="input" rows="1" spellcheck="false" autocomplete="off" autocapitalize="sentences"></textarea>
    <button id="save" aria-label="Zapisz linijkę">+</button>
    <div id="hint"></div>
  </div>
  <div id="toast" role="status"></div>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
